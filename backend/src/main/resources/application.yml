server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: donation-ledger-api
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null

app:
  database-url: ${DATABASE_URL}
  database-ssl: ${DATABASE_SSL:false}
  currency-code: ${CURRENCY_CODE:USD}
  admin-signup-code: ${ADMIN_SIGNUP_CODE:2664}
  session-days: ${SESSION_DAYS:14}
  cookie-secure: ${COOKIE_SECURE:false}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  frontend-url: ${FRONTEND_URL:}
